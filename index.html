<script>
const SB_URL='https://fjapwnlampfvoqnqxdgu.supabase.co',SB_KEY='sb_publishable_GJAxmPxuneRacR6CmMHFoA_kcwwJSvu';
const YN0={"2025": {"1": "Metin Balkesen", "2": "Hüseyin Uçar", "3": "Ayşe Kartal", "4": "Şeriban Kaygusuz", "5": "İbrahim Baştuğ", "6": "Nurten Küçtemur", "7": "Yılmaz Akbalık", "8": "Emine Emlik", "9": "Kemal Erdoğan", "10": "Mehmet Kutlu", "11": "Özer Çakmak", "12": "Meral Yüksel", "13": "Nisa Meriç", "14": "M.Ali Kayhan"}, "2026": {"1": "Metin Balkesen", "2": "Hüseyin Uçar", "3": "Ayşe Kartal", "4": "Şehriban Kaygusuz", "5": "İbrahim Baştuğ", "6": "Nurten Küçtemur", "7": "Mustafa Çelik", "8": "Emine Emlik", "9": "Kemal Erdoğan", "10": "Mehmet Kutlu", "11": "Özer Çakmak", "12": "Meral Yüksel", "13": "Nisa Meriç", "14": "M.Ali Kayhan"}};
const sb=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY):null;
let SNAP=null,Q=Promise.resolve(),APID=null,MGR_=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const p2=n=>String(n).padStart(2,'0');
function toast(t,bad){let e=document.getElementById('cl_t');if(!e){e=document.createElement('div');e.id='cl_t';e.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;padding:8px 14px;border-radius:20px;font-size:13px;background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 8px #0003';document.body.appendChild(e)}
 e.textContent=t;e.style.color=bad?'var(--bad)':'var(--tx)';e.style.display='block';clearTimeout(e._t);if(!bad)e._t=setTimeout(()=>e.style.display='none',2500)}
function build(ap,d,o,a,g,t,to){
 const ym=(y,m)=>y+'-'+p2(m);
 const units=d.map(u=>({id:u.id,no:u.tip=='dukkan'?u.no:+u.no,name:u.sakin_adi||'',type:u.tip,muaf:!!u.muaf}));
 units.sort((x,y)=>(x.type==y.type?0:x.type=='daire'?-1:1)||String(x.no).localeCompare(String(y.no),'tr',{numeric:true}));
 const start=(ap.baslangic||'2025-01-01').slice(0,7);
 const pay={};o.forEach(r=>{const k=ym(r.yil,r.ay);(pay[k]=pay[k]||{})[r.daire_id]=((pay[k][r.daire_id])||0)+ +r.tutar});
 const rates=[];let last=null;[...a].sort((x,y)=>x.yil-y.yil||x.ay-y.ay).forEach(r=>{if(last===null||+r.tutar!==last){rates.push({from:ym(r.yil,r.ay),daire:+r.tutar,dukkan:0});last=+r.tutar}});
 if(!rates.length)rates.push({from:start,daire:0,dukkan:0});
 const exp=g.map(e=>({id:e.id,date:e.tarih,cat:e.tur||'',desc:e.aciklama||'',amt:+e.tutar,nd:1}));
 const camps=t.map(c=>{const pp={};to.filter(x=>x.tahsilat_id==c.id).forEach(x=>pp[x.daire_id]=(pp[x.daire_id]||0)+ +x.tutar);
  return{id:c.id,name:c.ad,total:+c.hedef||0,per:{daire:+c.daire_basi_tutar,dukkan:+c.daire_basi_tutar},inst:2,due:c.vade||'',spent:+c.harcanan||0,exempt:!!c.yonetici_muaf,pay:pp}});
 const pm={},col=o.length>0&&('odeme_sekli' in o[0]);window.__PMCOL=col;
 if(col)o.forEach(r=>{if(r.odeme_sekli){const k=ym(r.yil,r.ay);(pm[k]=pm[k]||{})[r.daire_id]=r.odeme_sekli}});
 else{try{Object.assign(pm,JSON.parse(localStorage.getItem('apt_pm')||'{}'))}catch(e){}}
 return{name:ap.ad,start,open:+ap.acilis_bakiyesi||0,rates,units,yn:clone(YN0),pay,pm,exp,camps,rev:Date.now()};
}
const chk=r=>{if(r.error)throw r.error;return r.data};
let LASTR=Date.now();
async function cloudRefresh(){
 try{await Q;if(JSON.stringify({...S,rev:0})!==JSON.stringify({...SNAP,rev:0})){toast('⚠ Kaydedilmemiş değişiklik var, yenileme atlandı',1);return false}
  const T=['apartmanlar','daireler','odemeler','aidat_tutarlari','giderler','tahsilatlar','tahsilat_odemeleri'];
  const r=await Promise.all(T.map(t=>sb.from(t).select('*').limit(5000)));const bad=r.find(x=>x.error);if(bad)throw bad.error;
  const[ap,d,o,a,g,t,to]=r.map(x=>x.data),n=build(ap[0],d,o,a,g,t,to);
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,n);SNAP=clone(S);LASTR=Date.now();return true}
 catch(e){toast('Güncel veri alınamadı, ekrandaki veriyle devam ediliyor',1);return false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SNAP&&Date.now()-LASTR>60000)cloudRefresh().then(ok=>{if(ok&&typeof R=='function')R()})});
function cloudSave(){Q=Q.then(sync).catch(e=>toast('⚠ Buluta kaydedilemedi: '+(e.message||e),1))}
async function sync(){
 if(!MGR_||!SNAP)return;const A=APID,s=SNAP,n=S;toast('☁ Kaydediliyor…');
 const known=id=>s.units.some(u=>u.id==id);
 for(const m of new Set([...Object.keys(s.pay),...Object.keys(n.pay)])){const[yl,ay]=m.split('-').map(Number);
  for(const id of new Set([...Object.keys(s.pay[m]||{}),...Object.keys(n.pay[m]||{})])){
   const a=(s.pay[m]||{})[id]||0,b=(n.pay[m]||{})[id]||0,pa=((s.pm||{})[m]||{})[id]||'',pb=((n.pm||{})[m]||{})[id]||'';if((a===b&&!(window.__PMCOL&&b>0&&pa!==pb))||!known(id))continue;
   chk(await sb.from('odemeler').delete().eq('daire_id',id).eq('yil',yl).eq('ay',ay));
   if(b>0){const row={apartman_id:A,daire_id:id,yil:yl,ay:ay,tutar:b};if(window.__PMCOL)row.odeme_sekli=pb||null;chk(await sb.from('odemeler').insert(row))}}}
 const se=new Map(s.exp.map(e=>[e.id,e]));
 for(const e of n.exp){const o=se.get(e.id),row={tarih:e.date,tur:e.cat,tutar:e.amt,aciklama:e.desc||null};
  if(!o){const r=chk(await sb.from('giderler').insert({apartman_id:A,...row}).select('id').single());e.id=r.id;s.exp.push(clone(e))}
  else{se.delete(e.id);if(o.date!=e.date||o.cat!=e.cat||o.amt!=e.amt||(o.desc||'')!=(e.desc||''))chk(await sb.from('giderler').update(row).eq('id',e.id))}}
 for(const id of se.keys())chk(await sb.from('giderler').delete().eq('id',id));
 const sc=new Map(s.camps.map(c=>[c.id,c]));
 for(const c of n.camps){let o=sc.get(c.id);const row={ad:c.name,daire_basi_tutar:c.per.daire,hedef:c.total,vade:c.due||null,harcanan:c.spent||0,yonetici_muaf:!!c.exempt};
  if(!o){const r=chk(await sb.from('tahsilatlar').insert({apartman_id:A,...row}).select('id').single());c.id=r.id;o={pay:{}};s.camps.push({...clone(c),pay:{}})}
  else{sc.delete(c.id);if(['name','total','due','spent','exempt'].some(k=>o[k]!=c[k])||o.per.daire!=c.per.daire)chk(await sb.from('tahsilatlar').update(row).eq('id',c.id))}
  for(const id of new Set([...Object.keys(o.pay||{}),...Object.keys(c.pay||{})])){
   const a=(o.pay||{})[id]||0,b=(c.pay||{})[id]||0;if(a===b||!known(id))continue;
   chk(await sb.from('tahsilat_odemeleri').delete().eq('tahsilat_id',c.id).eq('daire_id',id));
   if(b>0)chk(await sb.from('tahsilat_odemeleri').insert({apartman_id:A,tahsilat_id:c.id,daire_id:id,tutar:b}))}}
 for(const id of sc.keys())chk(await sb.from('tahsilatlar').delete().eq('id',id));
 if(JSON.stringify(n.rates)!=JSON.stringify(s.rates)){const rows=[],sy=+n.start.slice(0,4);
  for(let y=sy;y<=new Date().getFullYear()+1;y++)for(let m=1;m<=12;m++){const k=y+'-'+p2(m);if(k>=n.start)rows.push({apartman_id:A,yil:y,ay:m,tutar:rate('daire',k)})}
  chk(await sb.from('aidat_tutarlari').delete().eq('apartman_id',A));chk(await sb.from('aidat_tutarlari').insert(rows))}
 for(const u of n.units){const o=s.units.find(x=>x.id==u.id);if(o&&(o.name!=u.name||!!o.muaf!=!!u.muaf))chk(await sb.from('daireler').update({sakin_adi:u.name,muaf:!!u.muaf}).eq('id',u.id))}
 SNAP=clone(S);
 const skip=n.units.length!=s.units.length||n.name!=s.name||n.start!=s.start||(+n.open)!=(+s.open);
 toast(skip?'⚠ Birim ekleme/silme, ad, başlangıç ve açılış bakiyesi henüz buluta kaydedilmiyor':'☁ Buluta kaydedildi ✓',skip);
}

const norm=v=>v.toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9.]/g,'');
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')};
let KUL=[];const RL={sahip:'Sahip',yonetici:'Yönetici',sakin:'Sakin'};
function vKul(){setTimeout(loadKul,0);return'<div id="kul" class="card">Yükleniyor…</div>'}
async function loadKul(){const el=document.getElementById('kul');if(!el)return;
 const{data,error}=await sb.rpc('kullanici_listesi');
 if(error){el.innerHTML='<b>Kullanıcı listesi okunamadı</b><p class="mu">'+esc(error.message)+'</p><p class="mu">Kullanıcı yönetimi SQL kodunun Supabase\'de çalıştırıldığından emin olun.</p>';return}
 KUL=data;el.className='';
 el.innerHTML='<button class="p" onclick="kulForm()">➕ Yeni kullanıcı</button>'+KUL.map(k=>`<div class="card"><b>${esc(k.ad||k.kullanici)}</b><div class="mu" style="font-size:13px">${esc(k.kullanici)} · ${k.daire_no?'Birim '+esc(k.daire_no)+' · ':''}${RL[k.rol]||esc(k.rol)}</div>${k.rol=='sahip'?'':`<div class="two" style="margin-top:8px"><button class="g" onclick="kulSifre('${k.id}')">Şifre sıfırla</button><button class="g" style="color:var(--bad)" onclick="kulSil('${k.id}')">Sil</button></div>`}</div>`).join('')}
function kulForm(){openS(`<b>Yeni kullanıcı</b><label>Daire / birim</label><select id="kd" onchange="kdSec()"><option value="">Seçin…</option>${S.units.map(x=>`<option value="${x.id}">${x.type=='dukkan'?'Dükkan '+esc(x.no):esc(x.no)} · ${esc(x.name)}</option>`).join('')}</select>
<label>Kullanıcı adı (girişte yazılacak)</label><input id="kn" autocapitalize="none" autocorrect="off">
<label>Rol</label><select id="kr"><option value="sakin">Sakin (sadece görür)</option>${window.__ROLE=='sahip'?'<option value="yonetici">Yönetici (düzenleyebilir)</option>':''}</select>
<label>Geçici şifre</label><input id="ks" value="${genPw()}" autocapitalize="none">
<button class="p" onclick="kulKaydet()">Hesabı oluştur</button><button class="g" style="width:100%" onclick="closeS()">Vazgeç</button>`)}
function kdSec(){const u=S.units.find(x=>x.id==$('#kd').value);if(u)$('#kn').value=norm(u.name)}
function kulBilgi(b,kn,pw){openS(`<b>${b}</b><div class="card"><div class="mu">Kullanıcı adı</div><b>${esc(kn)}</b><div class="mu" style="margin-top:8px">Geçici şifre</div><b>${esc(pw)}</b></div><p class="mu">Bu bilgileri kişiye özelden iletin. Girişten sonra şifresini kendisi değiştirebilir. Bu şifre bir daha gösterilmez.</p><button class="p" onclick="closeS();loadKul()">Tamam</button>`)}
async function kulKaydet(){const kd=$('#kd').value,kn=$('#kn').value.trim(),ks=$('#ks').value;
 if(!kd)return alert('Daire / birim seçin.');if(norm(kn).length<3)return alert('Kullanıcı adı en az 3 harf olmalı.');if(ks.length<8)return alert('Şifre en az 8 karakter olmalı.');
 const{data,error}=await sb.rpc('kullanici_ekle',{p_kullanici:kn,p_daire_id:kd,p_rol:$('#kr').value,p_sifre:ks});
 if(error)return alert('Oluşturulamadı: '+error.message);kulBilgi('Hesap oluşturuldu ✓',data,ks)}
async function kulSifre(id){const k=KUL.find(x=>x.id==id);if(!k||!confirm((k.ad||k.kullanici)+' için yeni geçici şifre oluşturulsun mu?'))return;const pw=genPw();
 const{error}=await sb.rpc('kullanici_sifre_sifirla',{p_id:id,p_sifre:pw});if(error)return alert('Sıfırlanamadı: '+error.message);kulBilgi('Şifre sıfırlandı ✓',k.kullanici,pw)}
async function kulSil(id){const k=KUL.find(x=>x.id==id);if(!k||!confirm((k.ad||k.kullanici)+' hesabı silinsin mi? Bu kişi artık giriş yapamaz.'))return;
 const{error}=await sb.rpc('kullanici_sil',{p_id:id});if(error)return alert('Silinemedi: '+error.message);loadKul()}

</script>
<script type="text/plain" id="orig">
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const LINK='https://claude.ai/artifact/3WhVdzEMbWqmLHDmudWP1M';
const $=s=>document.querySelector(s);
const INC=typeof claude!=='undefined'&&!!claude&&typeof claude.use==='function';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm2=n=>(Math.round(n*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
const fmt=n=>Math.round(n).toLocaleString('tr-TR')+' ₺';
const nf=n=>Math.round(n).toLocaleString('tr-TR');
const pad=n=>String(n).padStart(2,'0');
const UP=s=>String(s).toLocaleUpperCase('tr-TR');
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function shift(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)}
const lbl=ym=>{const[y,m]=ym.split('-');return MN[m-1]+' '+y};
const dts=d=>d?d.split('-').reverse().join('.'):'-';
const EMB=window.__EMB;
let S=EMB,MODE='res',T='ay',YM=ymNow(),Y=+YM.slice(0,4),AT='aidat',CID=null;
const loadLocal=()=>null;
const flag=()=>{try{return localStorage.getItem('apt_mgr')=='1'}catch(e){return false}};
const dirty=()=>{try{return localStorage.getItem('apt_dirty')=='1'}catch(e){return false}};
function save(){S.rev=Date.now();try{if(!window.__PMCOL)localStorage.setItem('apt_pm',JSON.stringify(S.pm||{}))}catch(e){}cloudSave()}
function login(){try{localStorage.setItem('apt_mgr','1')}catch(e){}setMode('mgr')}
function setMode(m){MODE=m;const l=loadLocal();S=m=='mgr'?(l&&(l.rev||0)>=(EMB.rev||0)?l:EMB):EMB;if(m=='res'&&!['ay','yil','tad'].includes(T))T='ay';R()}

/* ---- model ---- */
const U=()=>S.units;
function rate(t,ym){const r=[...S.rates].sort((a,b)=>a.from<b.from?-1:1);let v=r[0][t];r.forEach(x=>{if(x.from<=ym)v=x[t]});return v}
const due=(u,ym)=>ym>=S.start&&!u.muaf?rate(u.type,ym):0;
const pd=(u,ym)=>(S.pay[ym]&&S.pay[ym][u.id])||0;
const gel=ym=>U().reduce((a,u)=>a+pd(u,ym),0);
const items=ym=>S.exp.filter(e=>e.date.slice(0,7)==ym).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const gid=ym=>items(ym).reduce((a,e)=>a+e.amt,0);
function kasa(ym){let k=+S.open||0;for(const m in S.pay)if(m<=ym)for(const id in S.pay[m])k+=S.pay[m][id];S.exp.forEach(e=>{if(e.date.slice(0,7)<=ym)k-=e.amt});return k}
const devir=ym=>kasa(shift(ym,-1));
const strip=s=>String(s).replace(/^\s*\d+\s*-\s*/,'');
const nm=(u,y)=>strip((S.yn&&S.yn[y]&&S.yn[y][u.no])||u.name);
const lab=(u,y)=>u.type=='daire'?`${u.no}- ${UP(nm(u,y))}`:UP(nm(u,y));
const labU=u=>u.type=='daire'?`${u.no}- ${UP(strip(u.name))}`:UP(strip(u.name));
const yUnits=y=>U().filter(u=>u.type=='daire'||Object.keys(S.pay).some(m=>m.slice(0,4)==y&&pd(u,m)>0));
const mUnits=ym=>U().filter(u=>u.type=='daire'||pd(u,ym)>0);
const missing=ym=>ym<=ymNow()?mUnits(ym).filter(u=>due(u,ym)>0&&pd(u,ym)<due(u,ym)):[];
function stat(u,ym){const d=due(u,ym),p=pd(u,ym);
if(u.muaf&&p==0)return['Yönetici','mu'];if(d==0&&p==0)return['–','mu'];if(p>=d&&p>0)return['Ödedi','ok'];if(p>0)return['Kısmi','wa'];return ym<=ymNow()?['Ödemedi','bad']:['–','mu']}
function debt(u,ym){let d=0,m=S.start,c=0;while(m<=ym&&c++<600){d+=due(u,m)-pd(u,m);m=shift(m,1)}return d}
const camp=id=>S.camps.find(c=>c.id==id);
const cShare=(c,u)=>(c.exempt&&u.muaf)?0:(c.per[u.type]||0),cPaid=(c,u)=>c.pay[u.id]||0;
function cStat(c){let tg=0,tp=0;U().forEach(u=>{tg+=cShare(c,u);tp+=cPaid(c,u)});return{tg,tp}}

/* ---- ortak ---- */
function openS(h){$('#sh').innerHTML=h;$('#sh').style.display='block';$('#bk').style.display='block'}
function closeS(){$('#sh').style.display='none';$('#bk').style.display='none'}
function go(n){YM=shift(YM,n);R()}
const nav=()=>`<div class="nav"><button onclick="go(-1)">‹</button><b>${lbl(YM)}</b><button onclick="go(1)">›</button></div>`;
const ynav=()=>`<div class="nav"><button onclick="Y--;R()">‹</button><b>${Y}</b><button onclick="Y++;R()">›</button></div>`;
function setT(t){T=t;if(t=='tad'||t=='aidat'){CID=null}R();scrollTo(0,0)}
const mgr=()=>MODE=='mgr';

/* ---- Aylık ---- */
function vAy(){const ym=YM,it=items(ym),g=gel(ym),x=gid(ym),mu=mUnits(ym),ms=missing(ym);
const sr=[['GELİR',g,'ok'],['GİDER',x,'wa'],['ÇIKAN',g-x,g-x<0?'bad':''],['GEÇEN AY DEVREDEN',devir(ym),''],['KASADA KALAN',kasa(ym),'']];
return nav()+`<div class="card"><b>${ym.slice(0,4)} ${UP(MN[+ym.slice(5)-1])} GELİR GİDER TABLOSU</b><div style="margin-top:6px">${sr.map((r,i)=>`<div class="row"><span>${r[0]}</span><b class="${r[2]}" style="${i==4?'font-size:18px':''}">${fm2(r[1])}</b></div>`).join('')}</div></div>
<h2>Aidat durumu</h2><div class="card" style="padding:4px 14px">${mu.map(u=>{const s=stat(u,ym),p=pd(u,ym);return`<div class="row"><span>${u.type=='daire'?u.no+'- ':''}${esc(nm(u,+ym.slice(0,4)))}</span><span><b class="${s[1]}">${s[0]}</b>${p>0?' · '+fm2(p):''}${rcBtn(u.id,ym)}</span></div>`}).join('')}</div>
${ms.length?`<h2>Aidatını veremeyenler</h2><div class="card"><span class="bad">${ms.map(u=>esc(nm(u,+ym.slice(0,4)))).join(', ')}</span></div>`:''}
<h2>Bu ay giderler</h2><div class="card" style="padding:4px 14px">${it.length?it.map((e,i)=>`<div class="row"><span>${i+1}. ${esc(e.cat)}${e.desc?' – '+esc(e.desc):''}</span><b>${fm2(e.amt)}</b></div>`).join(''):'<div class="row"><small>Bu ay gider yok</small></div>'}<div class="row"><b>Toplam gider</b><b class="wa">${fm2(x)}</b></div></div>`
+(mgr()?`<button class="p" onclick="openImg('ay')">🖼️ Aylık görseli paylaş (WhatsApp)</button><button class="g" style="width:100%" onclick="openMsg()">📣 Duyuru metni (linkli)</button><button class="g" style="width:100%" onclick="xl([${ym.slice(0,4)}])">⬇ Excel indir (${ym.slice(0,4)})</button>`+pubBar():'')}

/* ---- Yıllık ---- */
function vYil(){const y=Y,mo=[...Array(12)].map((_,i)=>y+'-'+pad(i+1)),un=yUnits(y),now=ymNow();
const cell=(u,ym)=>{const p=pd(u,ym),d=due(u,ym);if(p>0)return`<td class="${p<d?'wa':''}">${nf(p)}</td>`;if(u.muaf&&ym>=S.start)return'<td class="mu">YÖN.</td>';if(d>0&&ym<=now)return'<td class="bad">✗</td>';return'<td></td>'};
const act=ym=>ym>=S.start;
const sm=(f,tot)=>mo.map(ym=>act(ym)?`<td>${nf(f(ym))}</td>`:'<td></td>').join('')+`<td><b>${tot==null?'':nf(tot)}</b></td>`;
const G=mo.reduce((a,m)=>a+gel(m),0),X=mo.reduce((a,m)=>a+gid(m),0);
return ynav()+`<div class="card wrap" style="padding:6px"><table class="tbl"><tr><th>${y} AİDAT</th>${MN.map(m=>`<th>${UP(m.slice(0,3))}</th>`).join('')}<th>Yıl</th></tr>
${un.map(u=>`<tr><td>${u.type=='daire'?u.no+'- ':''}${esc(nm(u,y))}</td>${mo.map(m=>cell(u,m)).join('')}<td><b>${nf(mo.reduce((a,m)=>a+pd(u,m),0))}</b></td></tr>`).join('')}
<tr><td><b>GELİR</b></td>${sm(gel,G)}</tr><tr><td><b>GİDER</b></td>${sm(gid,X)}</tr><tr><td><b>ÇIKAN</b></td>${sm(m=>gel(m)-gid(m),G-X)}</tr>
<tr><td><b>GEÇEN AY DEV.</b></td>${sm(devir,null)}</tr><tr><td><b>KASADA KALAN</b></td>${sm(kasa,null)}</tr></table></div>
<small class="mu">✗ ödenmedi · sarı: kısmi · YÖN. yönetici (aidat yok). Tutarlar ₺, yuvarlanmış.</small>`
+(mgr()?`<button class="p" onclick="openImg('yil')">🖼️ Yıllık görseli paylaş (WhatsApp)</button><button class="g" style="width:100%" onclick="xl([${y}])">⬇ Excel indir (${y})</button><button class="g" style="width:100%" onclick="xl(allYears())">⬇ Excel indir (tüm yıllar)</button><button class="p" onclick="openFaal(${y})">📄 Faaliyet Raporu (PDF / görsel)</button>`+pubBar():'')}
const allYears=()=>{const a=[];for(let y=+S.start.slice(0,4);y<=Math.max(+ymNow().slice(0,4),Y);y++)a.push(y);return a};

/* ---- Aidat girişi (yönetici) ---- */
const seg=()=>`<div class="two" style="margin:8px 0"><button class="${AT=='aidat'?'p':'g'}" style="margin:0" onclick="AT='aidat';R()">Aidat</button><button class="${AT=='tad'?'p':'g'}" style="margin:0" onclick="AT='tad';CID=null;R()">Tadilat / Ek tahsilat</button></div>`;
function vAidat(){return seg()+(AT=='aidat'?vAidatAy():vTad(false))}
function vAidatAy(){const ym=YM,s=[0,0];U().forEach(u=>{s[0]+=due(u,ym);s[1]+=pd(u,ym)});
return nav()+`<div class="card" style="padding:4px 14px">${U().filter(u=>u.type=='daire'||pd(u,ym)>0).map(u=>{const d=due(u,ym),p=pd(u,ym),b=debt(u,ym),st=stat(u,ym);
return`<div class="row" onclick="openPay('${u.id}')"><div><b>${esc(u.name)}</b><small>Aidat ${fm2(d)} · ödenen ${fm2(p)}${p>0&&pmOf(u.id,ym)?' · '+(pmOf(u.id,ym)):''}${b>0.5?' · toplam borç '+fm2(b):''}</small></div><div style="display:flex;align-items:center"><span class="chip ${st[1]}">${st[0]}</span>${rcBtn(u.id,ym)}</div></div>`}).join('')}</div><small class="mu">Tahsilat: ${fm2(s[1])} / ${fm2(s[0])}. Satıra dokunup ödeme girin.</small>`}
const pmOf=(id,ym)=>{const v=(S.pm&&S.pm[ym]&&S.pm[ym][id])||'';return v=='EFT'?'EFT':v};
let PMSEL='Nakit';
const PMS=[['Nakit','Nakit'],['EFT','EFT']];
const pmBtns=()=>PMS.map(a=>`<button class="${PMSEL==a[0]?'p':'g'}" style="margin:0" onclick="pmPick('${a[0]}')">${a[1]}</button>`).join('');
function pmPick(m){PMSEL=m;const e=$('#pmb');if(e)e.innerHTML=pmBtns()}
function openPay(id){const u=U().find(x=>x.id==id),d=due(u,YM),p=pd(u,YM);PMSEL=pmOf(id,YM)||'Nakit';
openS(`<b>${esc(u.name)} · ${lbl(YM)}</b><p style="margin:4px 0" class="mu">Aidat: ${fm2(d)}</p><label>Ödenen tutar (₺)</label><input id="pv" type="number" inputmode="decimal" value="${p||''}">
<label>Ödeme şekli</label><div class="two" id="pmb" style="margin:4px 0 8px">${pmBtns()}</div>
${d>0?`<button class="p" onclick="setPay('${id}',${d})">Tam ödendi (${fm2(d)})</button>`:''}<div class="two"><button class="g" onclick="setPay('${id}',+$('#pv').value||0)">Kaydet</button><button class="g" onclick="setPay('${id}',0)">Sıfırla</button></div>`)}
function setPay(id,v){if(!S.pay[YM])S.pay[YM]={};if(!S.pm)S.pm={};if(!S.pm[YM])S.pm[YM]={};
if(v>0){S.pay[YM][id]=v;S.pm[YM][id]=PMSEL}else{delete S.pay[YM][id];delete S.pm[YM][id]}save();closeS();R()}

/* ---- Tadilat ---- */
function vTad(ro){if(CID){const c=camp(CID);if(c)return vCamp(c,ro);CID=null}
return S.camps.map(c=>{const s=cStat(c),p=s.tg?Math.min(100,s.tp/s.tg*100):0;return`<div class="card" onclick="CID='${c.id}';R()"><b>${esc(c.name)}</b><div class="bar"><i style="width:${p}%"></i></div><small class="mu">Toplanan ${fm2(s.tp)} / ${fm2(s.tg)} · kalan ${fm2(s.tg-s.tp)}</small></div>`}).join('')+(ro?'':`<button class="p" onclick="openCamp()">+ Yeni tadilat / ek tahsilat</button>`)}
function vCamp(c,ro){const s=cStat(c),sp=c.spent||0,n=U().filter(u=>cShare(c,u)>0&&cPaid(c,u)>=cShare(c,u)).length;
return`<button class="g" style="margin:0 0 8px" onclick="CID=null;R()">‹ Listeye dön</button>
<div class="card"><b>${esc(c.name)}</b><small style="display:block" class="mu">${c.inst} taksit · son tarih ${dts(c.due)}${c.total?' · toplam maliyet '+fm2(c.total):''}</small>
<div class="grid" style="margin-top:8px"><div class="k"><small>Hedef</small><b>${fm2(s.tg)}</b></div><div class="k"><small>Toplanan</small><b class="ok">${fm2(s.tp)}</b></div><div class="k"><small>Kalan tahsilat</small><b class="${s.tg>s.tp?'bad':''}">${fm2(s.tg-s.tp)}</b></div><div class="k"><small>Harcanan · kasada kalan</small><b class="wa">${fm2(sp)} · ${fm2(s.tp-sp)}</b></div></div>
<small class="mu">${n} / ${U().filter(u=>cShare(c,u)>0).length} birim tamamladı</small>${ro?'':`<button class="p" onclick="openImg('tad')">🖼️ Tadilat görselini paylaş (WhatsApp)</button><button class="g" style="width:100%" onclick="xlT('${c.id}')">⬇ Excel indir (tadilat)</button><button class="g" style="width:100%" onclick="openCamp('${c.id}')">Düzenle</button>`}</div>
<div class="card" style="padding:4px 14px">${U().map(u=>{const sh=cShare(c,u),p=cPaid(c,u),st=sh>0&&p>=sh?['Ödendi','ok']:p>0?['Kısmi','wa']:sh==0?['Muaf','mu']:['Ödenmedi','bad'],k=sh>0?Math.floor(p/(sh/c.inst)+1e-6):0;
return`<div class="row" ${ro?'':`onclick="openCP('${c.id}','${u.id}')"`}><div><b>${esc(u.name)}</b><small>Pay ${fm2(sh)} · ödenen ${fm2(p)}${c.inst>1&&p>0&&p<sh?' · '+k+'/'+c.inst+' taksit':''}${p<sh?' · kalan '+fm2(sh-p):''}</small></div><div style="display:flex;align-items:center"><span class="chip ${st[1]}">${st[0]}</span>${!ro&&p>0?rcBtnC(c.id,u.id):''}</div></div>`}).join('')}</div>`}
function openCP(cid,id){const c=camp(cid),u=U().find(x=>x.id==id),sh=cShare(c,u),p=cPaid(c,u),q=sh/c.inst;
openS(`<b>${esc(u.name)} · ${esc(c.name)}</b><p style="margin:4px 0" class="mu">Pay: ${fm2(sh)}${c.inst>1?' ('+c.inst+' × '+fm2(q)+')':''} · ödenen ${fm2(p)}</p><label>Ödenen toplam (₺)</label><input id="cv" type="number" inputmode="decimal" value="${p||''}">
<button class="p" onclick="setCP('${cid}','${id}',${sh})">Tam ödendi</button>${c.inst>1?'<div class="two">'+Array.from({length:c.inst-1},(_,i)=>`<button class="g" onclick="setCP('${cid}','${id}',${Math.round(q*(i+1))})">${i+1}. taksit</button>`).join('')+'</div>':''}
<div class="two"><button class="g" onclick="setCP('${cid}','${id}',+$('#cv').value||0)">Kaydet</button><button class="g" onclick="setCP('${cid}','${id}',0)">Sıfırla</button></div>`)}
function setCP(cid,id,v){const c=camp(cid);if(v>0)c.pay[id]=v;else delete c.pay[id];save();closeS();R()}
function openCamp(id){const c=id?camp(id):{name:'',total:'',per:{daire:'',dukkan:''},inst:1,due:'',spent:'',exempt:false};
openS(`<b>${id?'Düzenle':'Yeni tadilat / ek tahsilat'}</b><label>Ad</label><input id="cn" value="${esc(c.name)}">
<div class="two"><div><label>Daire payı (₺)</label><input id="cd" type="number" inputmode="decimal" value="${c.per.daire}"></div><div><label>Dükkan payı (₺)</label><input id="ck" type="number" inputmode="decimal" value="${c.per.dukkan}"></div></div>
<div class="two"><div><label>Taksit sayısı</label><input id="ci" type="number" inputmode="numeric" value="${c.inst}"></div><div><label>Son ödeme tarihi</label><input id="cdt" type="date" value="${c.due||''}"></div></div>
<label>Toplam maliyet (isteğe bağlı)</label><input id="ct" type="number" inputmode="decimal" value="${c.total||''}"><label>Harcanan (₺)</label><input id="cs" type="number" inputmode="decimal" value="${c.spent||''}">
<label class="cb"><input type="checkbox" id="cx" ${c.exempt?'checked':''}>Yönetici bu tahsilatı da vermez</label>
<button class="p" onclick="saveCamp('${id||''}')">Kaydet</button>${id?`<button class="g" style="width:100%;color:var(--bad)" onclick="delCamp('${id}',this)">Sil</button>`:''}`)}
function saveCamp(id){const o={name:$('#cn').value.trim()||'Tadilat',per:{daire:+$('#cd').value||0,dukkan:+$('#ck').value||0},inst:Math.max(1,Math.round(+$('#ci').value)||1),due:$('#cdt').value,exempt:$('#cx').checked,total:+$('#ct').value||0,spent:+$('#cs').value||0};
if(id)Object.assign(camp(id),o);else{const n={id:uid(),pay:{},...o};S.camps.push(n);CID=n.id}save();closeS();R()}
function delCamp(id,b){if(!b.dataset.a){b.dataset.a=1;b.textContent='Emin misiniz? Tekrar dokunun';return}S.camps=S.camps.filter(c=>c.id!=id);CID=null;save();closeS();R()}

/* ---- Gider (yönetici) ---- */
function vGider(){const l=items(YM),t=gid(YM);
return nav()+`<div class="card"><div class="k"><small>${lbl(YM)} toplam gider</small><b class="wa">${fm2(t)}</b></div><button class="p" onclick="openExp()">+ Gider ekle</button></div>
<div class="card" style="padding:4px 14px">${l.length?l.map(e=>`<div class="row" onclick="openExp('${e.id}')"><div><b>${esc(e.cat)}</b><small>${e.nd?'':dts(e.date)}${e.desc?(e.nd?'':' · ')+esc(e.desc):''}</small></div><b>${fm2(e.amt)}</b></div>`).join(''):'<div class="row"><small>Bu ay gider yok</small></div>'}</div>`}
function openExp(id){const e=id?S.exp.find(x=>x.id==id):null,kn=!e||CATS.includes(e.cat),n=new Date(),dd=ymNow()==YM?YM+'-'+pad(n.getDate()):YM+'-01';
openS(`<b>${e?'Gideri düzenle':'Yeni gider'}</b><label>Tarih</label><input id="ed" type="date" value="${e?e.date:dd}"><label>Gider türü</label>
<select id="ec" onchange="$('#ew').style.display=this.value=='__x'?'block':'none'">${CATS.map(c=>`<option${e&&e.cat==c?' selected':''}>${c}</option>`).join('')}<option value="__x"${kn?'':' selected'}>Boş (kendim yazarım)</option></select>
<div id="ew" style="display:${kn?'none':'block'}"><label>Gider adı</label><input id="ex" value="${kn?'':esc(e.cat)}" placeholder="Örn: Apartman Görevlisi"></div>
<label>Açıklama (isteğe bağlı)</label><input id="ed2" value="${e?esc(e.desc||''):''}"><label>Tutar (₺)</label><input id="ea" type="number" inputmode="decimal" value="${e?e.amt:''}">
<button class="p" onclick="saveExp('${id||''}')">Kaydet</button>${e?`<button class="g" style="width:100%;color:var(--bad)" onclick="delExp('${id}',this)">Sil</button>`:''}`)}
function saveExp(id){const sel=$('#ec').value,o={date:$('#ed').value,cat:sel=='__x'?($('#ex').value.trim()||'Diğer'):sel,desc:$('#ed2').value.trim(),amt:+$('#ea').value};if(!o.date||!(o.amt>0))return;
if(id){const e=S.exp.find(x=>x.id==id);Object.assign(e,o);if(e.date!=o.date)delete e.nd}else S.exp.push({id:uid(),...o});YM=o.date.slice(0,7);save();closeS();R()}
function delExp(id,b){if(!b.dataset.a){b.dataset.a=1;b.textContent='Emin misiniz? Tekrar dokunun';return}S.exp=S.exp.filter(x=>x.id!=id);save();closeS();R()}

/* ---- Ayarlar (yönetici) ---- */
function vAyar(){return`<div class="card"><label>Apartman adı</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();R()">
<label>Kayıt başlangıç ayı</label><input type="month" value="${S.start}" onchange="if(this.value){S.start=this.value;save()}">
<label>Başlangıçtan önceki kasa (devir, ₺)</label><input type="number" inputmode="decimal" value="${S.open||0}" onchange="S.open=+this.value||0;save()"></div>
<h2>Aylık aidat tutarı</h2><div class="card">${[...S.rates].sort((a,b)=>a.from<b.from?-1:1).map(r=>`<div class="row"><div><b>${lbl(r.from)} itibarıyla</b><small>Daire ${fm2(r.daire)} · Dükkan ${fm2(r.dukkan)}</small></div>${S.rates.length>1?`<button class="g" style="margin:0" onclick="delRate('${r.from}')">Sil</button>`:''}</div>`).join('')}
<label>Yeni tutar · geçerlilik ayı</label><input id="rf" type="month" value="${YM}"><div class="two"><div><label>Daire</label><input id="rd" type="number" inputmode="decimal"></div><div><label>Dükkan</label><input id="rk" type="number" inputmode="decimal" value="0"></div></div>
<button class="p" onclick="addRate()">Tutarı kaydet</button><small class="mu">Zamdan önceki aylar eski tutarla kalır.</small></div>
<h2>Birimler · Muaf işaretli birim aidat vermez</h2><div class="card">${U().map((u,i)=>`<div class="two" style="grid-template-columns:1fr 84px 62px 44px;align-items:center"><input value="${esc(u.name)}" onchange="U()[${i}].name=this.value;save()"><select onchange="U()[${i}].type=this.value;save()"><option value="daire"${u.type=='daire'?' selected':''}>Daire</option><option value="dukkan"${u.type=='dukkan'?' selected':''}>Dükkan</option></select>
<label class="cb" style="margin:0;font-size:12px"><input type="checkbox" ${u.muaf?'checked':''} onchange="U()[${i}].muaf=this.checked;save()">Muaf</label><button class="g" style="margin:4px 0;padding:10px 8px" onclick="delU(${i},this)">✕</button></div>`).join('')}
<div class="two"><button class="g" onclick="addU('daire')">+ Daire</button><button class="g" onclick="addU('dukkan')">+ Dükkan</button></div></div>
<h2>Aidat makbuzu</h2><div class="card"><label>Tahsil eden (yönetici) ad soyad</label><input value="${esc(rcCfg().yon)}" onchange="rcSet('yon',this.value)"><small class="mu" style="display:block">Boş bırakırsanız otomatik olarak “Muaf” işaretli dairenin sakini (yönetici) yazılır. Yönetici değişince yeni kişiyi Muaf işaretlemeniz yeterlidir.</small>
<label>Apartman adresi</label><input value="${esc(rcCfg().adres)}" onchange="rcSet('adres',this.value)">
<label>Varsayılan ödeme şekli</label><select onchange="rcSet('odeme',this.value)">${['Nakit','EFT','Kredi kartı'].map(o=>`<option${o==rcCfg().odeme?' selected':''}>${o}</option>`).join('')}</select>
<label>Makbuz alt notu (isteğe bağlı)</label><input value="${esc(rcCfg().not)}" placeholder="Örn: Aidat IBAN: TR.. / İletişim: 05.." onchange="rcSet('not',this.value)">

 pages.forEach((c,i)=>{const n=3+3*i;offs[n]=len;
  add(n+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jp[i].length+'>>\nstream\n');add(jp[i]);add('\nendstream\nendobj\n');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(n+1,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
  obj(n+2,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+n+' 0 R>>>>/Contents '+(n+1)+' 0 R>>')});
 const N=3+3*pages.length,xo=len;let xr='xref\n0 '+N+'\n0000000000 65535 f \n';

 return new Blob(parts,{type:'application/pdf'})}
function faalPng(pages){return new Promise(res=>{const g=14,o=document.createElement('canvas');o.width=FW;o.height=pages.length*FH+(pages.length-1)*g;const z=o.getContext('2d');z.fillStyle='#e5e7eb';z.fillRect(0,0,o.width,o.height);pages.forEach((p,i)=>z.drawImage(p,0,i*(FH+g)));o.toBlob(res,'image/png')})}

 const bad=r.find(x=>x.error);if(bad)return lgView('Veri okunamadı: '+bad.error.message);
 const[p,ap,d,o,a,g,t,to]=r.map(x=>x.data),me=p.find(x=>x.id===user.id);
 if(!me||!me.apartman_id)return lgView('Bu hesap henüz bir apartmana bağlı değil.');
 window.__EMB=build(ap[0],d,o,a,g,t,to);SNAP=clone(window.__EMB);APID=me.apartman_id;MGR_=['yonetici','sahip'].includes(me.rol);window.__MGR=MGR_;window.__ROLE=me.rol;
 LG.style.display='none';
 const s=document.createElement('script');s.textContent=document.getElementById('orig').textContent;document.body.appendChild(s);
 const c=document.createElement('button');c.textContent='🔑 Şifre değiştir';
 c.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:12px';
 c.onclick=()=>passView();document.body.appendChild(c);
 const f=document.createElement('div');f.style.cssText='display:flex;justify-content:center;margin:22px 0 6px';
 f.innerHTML='<button id="fo" style="padding:12px 28px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--bad);font:inherit;font-weight:600">Çıkış yap</button>';
 document.getElementById('app').insertAdjacentElement('afterend',f);
 document.getElementById('fo').onclick=async()=>{await sb.auth.signOut();location.reload()}}
boot();
